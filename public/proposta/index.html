<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Propostas · Jonathan Bolanle</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@400&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0b0b0d; --ink:#f4f4f6; --muted:#8a8a95; --accent:#3d68ff; color-scheme:dark; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:Inter, Arial, sans-serif; }
  body{ display:grid; place-items:center; padding:24px; box-sizing:border-box;
        background:radial-gradient(600px 600px at 100% -10%, rgba(61,104,255,.2), transparent 65%), var(--bg); }
  div{ max-width:440px; display:flex; flex-direction:column; gap:16px; }
  span{ font-family:"JetBrains Mono", monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  h1{ margin:0; font-family:"Space Grotesk", sans-serif; font-weight:400; font-size:32px; letter-spacing:-.02em; }
  p{ margin:0; color:var(--muted); line-height:1.6; }
  a{ color:var(--ink); }
</style>
</head>
<body>
  <div>
    <span>Propostas</span>
    <h1>Cada proposta tem seu próprio link.</h1>
    <p>Se você recebeu uma proposta, use o link que veio na mensagem. Para pedir um orçamento, fale comigo pelo <a href="https://jonathanbolanle.studio/pt">jonathanbolanle.studio</a>.</p>
  </div>
</body>
</html>
